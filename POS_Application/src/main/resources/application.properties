spring.application.name=POS_Application
server.port=7070

# Local secrets live in config/local.properties (not committed); environment variables override them.
spring.config.import=optional:file:./config/local.properties,optional:file:./POS_Application/config/local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/post_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}

